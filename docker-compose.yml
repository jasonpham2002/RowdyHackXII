services:
  postgres:
    image: postgres:16
    container_name: blink-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: blinkchilling
    ports:
      - "5432:5432"
    volumes:
      - blink_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blinkchilling"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  blink_pg:
