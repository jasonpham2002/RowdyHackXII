      <button type="button" class="frame" data-id="job" style="left: 770px; top: 40px">
        <span class="frame-index">01</span>
        <h2>The job</h2>
        <p>You stay silent on the job. Hands and voice are sometimes unavailable, and a phone can be out of reach. A letter board is slow. The laptop camera is already in the room.</p>
      </button>

      <button type="button" class="frame" data-id="pipe" style="left: 1560px; top: 300px">
        <span class="frame-index">02</span>
        <h2>The pipeline</h2>
        <ol class="steps">
          <li>Webcam frame</li>
          <li>Eyelid landmarks</li>
          <li>Eye Aspect Ratio, each eye</li>
          <li>Your open and closed calibration</li>
          <li>Assist shortcut, or a Morse letter</li>
        </ol>
      </button>

      <button type="button" class="frame" data-id="lang" style="left: 1500px; top: 960px">
        <span class="frame-index">03</span>
        <h2>Blink language</h2>
        <ul class="rules">
          <li><span>40–250 ms</span> Dot</li>
          <li><span>Past 250 ms</span> Dash</li>
          <li><span>Open 0.7 s</span> End the letter</li>
          <li><span>Left wink</span> Delete</li>
          <li><span>Right wink</span> Suggestion</li>
        </ul>
      </button>

      <button type="button" class="frame" data-id="show" style="left: 140px; top: 960px">
        <span class="frame-index">04</span>
        <h2>What you will show</h2>
        <p>This part happens on the laptop, in the webcam app.</p>
        <ol class="steps">
          <li>Calibrate eyes open, then gently closed.</li>
          <li>Three dots. The banner is a simulated SOS. It does not call 911.</li>
          <li>Blink a short word. Show Raw and Clean, then press Send.</li>
        </ol>
      </button>

      <button type="button" class="frame" data-id="after" style="left: 80px; top: 300px">
        <span class="frame-index">05</span>
        <h2>Limits and next</h2>
        <p>Dispatch is simulated. The line sends after you confirm. Typing into another app happens only on Send. Nothing is uploaded.</p>
        <p>Next: harder lighting, a consented caregiver route, a phone camera.</p>
      </button>

      <div class="hud-actions">
        <p class="stamp" id="stamp" aria-live="polite">Map</p>
        <button type="button" class="overview" id="overview">Overview</button>
      </div>
    </header>
    <p class="keys">Click a title to zoom in. Esc, or Overview, returns to the map. Keys 1–5 and the arrows move between frames.</p>
